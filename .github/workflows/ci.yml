name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and server tests
        run: npm test
      - name: Browser test (two phones, simulated microphone and camera)
        run: |
          npm run model
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          PORT=8080 DB=/tmp/ci.db node --disable-warning=ExperimentalWarning server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/zdravi && break; sleep 1; done
          node test/prohlizec.mjs http://localhost:8080

  image:
    # Hotový obraz jen z veřejného repozitáře.
    if: github.repository == 'toomaaseek/chuvicka-baby-monitor' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
